<script>
/* =========================================================

const CHECKOUT_URL = "https://lastlink.com/p/C4DA25767/checkout-payment/";
const BRAND_NAME = "Fornecedores Verificados";

/* =========================================================
   STATE
   ========================================================= */
let stepIndex = 0;
const answers = {};

/* =========================================================
   STEPS DEFINITION
   ========================================================= */
const QUESTIONS = [
  {
    id:"situacao",
    type:"single",
    eyebrow:"1 de 8",
    title:"Qual é a sua situação atual com cosméticos?",

    ]
  },
  {
    id:"categoria",
    type:"multi",
    eyebrow:"2 de 8",
    title:"Qual categoria de cosméticos é a sua prioridade?",
    hint:"Escolha uma ou mais opções.",
    options:["Maquiagem","Perfumaria","Capilar","Skin care","Todas as opções acima, quanto mais variedade, melhor"]
  },
  {
    id:"como_vende",
    type:"multi",
    eyebrow:"3 de 8",

    options:[
      "Pelo WhatsApp para conhecidos e por indicação",

      "Tenho ou quero ter uma loja física",

  },
  {

    type:"multi",

      "Ainda não procurei, não sei por onde começar",

  },
  {
    id:"ja_aconteceu",
    type:"multi",
    eyebrow:"5 de 8",
    title:"Quais dessas situações já aconteceram com você?",
    hint:"Escolha uma ou mais opções.",
    options:[
      "Paguei caro em um produto que depois encontrei mais barato em outro lugar",
      "Caí em um golpe de falso fornecedor",
      "Não consegui revender porque o pedido mínimo era alto demais",
      "Ainda não comecei, mas tenho medo de passar por isso"
    ]
  },
  {
    id:"importante",
    type:"single",
    eyebrow:"6 de 8",

    hint:"Escolha uma opção.",
    options:[
      "Uma vez por mês, mais ou menos",
      "A cada 15 dias conforme as vendas dos produtos",
      "Semanalmente, quero girar o estoque rápido",

      "Ainda não iniciei para saber como será"
    ]
  }
];

// posições no fluxo onde entram telas de interlúdio (0-indexed, após a pergunta de índice X)
const INTERLUDE_AFTER = {1:"pain", 4:"curve"};

/* =========================================================
   FLOW: monta a lista total de "telas"
   ========================================================= */
const FLOW = [];
FLOW.push({type:"intro"});
QUESTIONS.forEach((q,i)=>{
  FLOW.push({type:"question", data:q});
  if(INTERLUDE_AFTER[i]) FLOW.push({type:"interlude", kind:INTERLUDE_AFTER[i]});
});
FLOW.push({type:"loading"});
FLOW.push({type:"results"});
FLOW.push({type:"capture"});
FLOW.push({type:"howworks"});
FLOW.push({type:"testimonials"});
FLOW.push({type:"offer"});

const totalProgressSteps = FLOW.filter(s=>s.type==="question").length;

/* =========================================================
   RENDER
   ========================================================= */
const app = document.getElementById("app");

function progressPercent(){
  const qIndex = FLOW.slice(0, stepIndex+1).filter(s=>s.type==="question").length;
  const base = (qIndex/totalProgressSteps)*88;
  return Math.min(96, Math.max(4, base));
}

function render(){
  const step = FLOW[stepIndex];
  let html = "";

  const showTopbar = step.type !== "loading";
  if(showTopbar){
    html += `
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <div class="brand-text">${BRAND_NAME}</div>
          <div class="brand-sub">${BRAND_SUB}</div>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPercent()}%"></div></div>
      ${stepIndex>0 && step.type!=="offer" ? `<button class="step-back" onclick="goBack()">‹ Voltar</button>` : ""}
    </div>`;
  }

  if(step.type==="intro") html += renderIntro();
  else if(step.type==="question") html += renderQuestion(step.data);
  else if(step.type==="interlude") html += renderInterlude(step.kind);
  else if(step.type==="loading") html += renderLoading();
  else if(step.type==="results") html += renderResults();
  else if(step.type==="capture") html += renderCapture();
  else if(step.type==="howworks") html += renderHowWorks();
  else if(step.type==="testimonials") html += renderTestimonials();
  else if(step.type==="offer") html += renderOffer();

  app.innerHTML = html;
  window.scrollTo({top:0, behavior:"smooth"});

  if(step.type==="loading") runLoading();
  if(step.type==="results") animateGauge();
  if(step.type==="offer") startTimer();
}

function goBack(){
  if(stepIndex>0){ stepIndex--; render(); }
}
function goNext(){
  if(stepIndex < FLOW.length-1){ stepIndex++; render(); }
}

/* ---------- QUESTION ---------- */
function renderQuestion(q){
  const selected = answers[q.id] || (q.type==="multi" ? [] : null);
  const optionsHtml = q.options.map((opt,i)=>{
    const isSel = q.type==="multi" ? selected.includes(i) : selected===i;
    return `
    <div class="option ${q.type==='single'?'radio':''} ${isSel?'selected':''}" onclick="selectOption('${q.id}','${q.type}',${i})">
      <div class="box"></div>
      <div>${opt}</div>
    </div>`;
  }).join("");

  const canContinue = q.type==="multi" ? (selected.length>0) : (selected!==null && selected!==undefined);

  return `
  <div class="screen">
    <div class="eyebrow">${q.eyebrow}</div>
    <h2 class="qtitle">${q.title}</h2>
    <div class="qhint">${q.hint}</div>
    <div class="options" id="opts">${optionsHtml}</div>
    <button class="btn btn-primary" id="continueBtn" ${canContinue?"":"disabled"} onclick="goNext()">Continuar</button>
  </div>`;
}

function selectOption(qid, type, idx){
  if(type==="multi"){
    if(!answers[qid]) answers[qid]=[];
    const arr = answers[qid];
    const pos = arr.indexOf(idx);
    if(pos>-1) arr.splice(pos,1); else arr.push(idx);
  } else {
    answers[qid] = idx;
  }
  render();
}

/* ---------- RESULTS ---------- */
function computeScore(){
  // score simples baseado em quantidade de respostas de "dor" marcadas — sempre alto, entre 88–97
  return 88 + Math.floor(Math.random()*9);
}
function renderResults(){
  const score = computeScore();
  window.__score = score;
  return `
  <div class="screen center">

    <div class="gauge-wrap">

            <stop offset="0%" stop-color="#c9a227"/>
            <stop offset="100%" stop-color="#0abab5"/>
          </linearGradient>
        </defs>
        <circle class="gauge-bg" cx="85" cy="85" r="72"/>
        <circle class="gauge-fill" id="gaugeCircle" cx="85" cy="85" r="72" stroke-dasharray="452" stroke-dashoffset="452"/>
      </svg>
      <div class="gauge-num">
        <div class="num" id="gaugeNum">0</div>
        <div class="lbl">Compatibilidade</div>
      </div>
    </div>
    <h2 style="font-size:20px;">Seu perfil foi identificado!</h2>
    <p class="qhint">Suas respostas indicam que você está pronta(o) pra dar o próximo passo. E o que está faltando não é esforço — é acesso.</p>
    <button class="btn btn-primary" onclick="goNext()">Ver o que você vai receber</button>
  </div>`;
}
function animateGauge(){
  const score = window.__score || 94;
  const circle = document.getElementById("gaugeCircle");
  const num = document.getElementById("gaugeNum");
  const circumference = 452;
  const offset = circumference - (circumference*score/100);
  setTimeout(()=>{ circle.style.strokeDashoffset = offset; },100);
  let cur=0;
  const step = Math.ceil(score/40);
  const t = setInterval(()=>{
    cur += step;
    if(cur>=score){cur=score; clearInterval(t);}
    num.textContent = cur;
  },25);
}

/* ---------- LEAD CAPTURE ---------- */
function renderCapture(){
  const name = answers.leadName || "";
  const whats = answers.leadWhats || "";
  return `
  <div class="screen">

    <h2 class="qtitle center" style="text-align:center;font-size:20px;">Falta pouco! Pra onde enviamos seu resultado?</h2>

      <div class="field-error">Digite seu nome pra continuar.</div>
    </div>

    <div class="field-group" id="whatsGroup">
      <label class="field-label">Seu WhatsApp</label>
      <input type="tel" class="field-input" id="leadWhats" placeholder="(31) 91234-5678" value="${whats}" oninput="onCaptureInput()">
      <div class="field-error">Digite um WhatsApp válido com DDD.</div>
    </div>

    <button class="btn btn-primary" id="captureBtn" disabled onclick="submitCapture()">Desbloquear meu resultado</button>
    <div class="privacy-note">🔒 Seus dados estão seguros e não serão compartilhados.</div>
  </div>`;
}

function onCaptureInput(){
  const nameVal = document.getElementById("leadName").value.trim();
  const whatsDigits = document.getElementById("leadWhats").value.replace(/\D/g,"");
  const btn = document.getElementById("captureBtn");
  const valid = nameVal.length>=3 && whatsDigits.length>=10;
  btn.disabled = !valid;
}

function submitCapture(){
  const nameEl = document.getElementById("leadName");
  const whatsEl = document.getElementById("leadWhats");
  const nameVal = nameEl.value.trim();
  const whatsDigits = whatsEl.value.replace(/\D/g,"");
  const nameGroup = document.getElementById("nameGroup");
  const whatsGroup = document.getElementById("whatsGroup");

  let ok = true;
  if(nameVal.length<3){ nameGroup.classList.add("invalid"); ok=false; } else nameGroup.classList.remove("invalid");
  if(whatsDigits.length<10){ whatsGroup.classList.add("invalid"); ok=false; } else whatsGroup.classList.remove("invalid");
  if(!ok) return;

  answers.leadName = nameVal;
  answers.leadWhats = whatsEl.value.trim();
  if(typeof fbq === "function"){ fbq('track', 'Lead'); }
  goNext();
}

let timerInterval;
function startTimer(){
  clearInterval(timerInterval);
  let totalSeconds = 15*60;
  const tmEl = document.getElementById("tm");
  const tsEl = document.getElementById("ts");
  timerInterval = setInterval(()=>{
    totalSeconds--;
    if(totalSeconds<=0){ totalSeconds=0; clearInterval(timerInterval); }
    const m = Math.floor(totalSeconds/60);
    const s = totalSeconds%60;
    if(tmEl) tmEl.textContent = String(m).padStart(2,"0");
    if(tsEl) tsEl.textContent = String(s).padStart(2,"0");
  },1000);
}
